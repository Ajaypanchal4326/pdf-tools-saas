<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Default Title (Home page overrides using SEOProvider) -->
    <title>PDFTools – Free PDF & Image Tools</title>

    <!-- Global Meta Description -->
    <meta
      name="description"
      content="PDFTools offers fast & free tools to convert, compress, merge, split, and convert PDF & image files. 100% secure and browser-based."
    />

    <!-- Global Keywords -->
    <meta
      name="keywords"
      content="pdf tools, free pdf tools, pdf editor, pdf converter, pdf compressor, merge pdf, split pdf, image converter, jpg to png, pdf to image"
    />

    <!-- Author -->
    <meta name="author" content="PDFTools" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourwebsite.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="PDFTools – Free PDF & Image Tools" />
    <meta
      property="og:description"
      content="Use 10+ free tools to convert, compress, merge, and edit PDF & image files instantly."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:url" content="https://yourwebsite.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PDFTools – Free PDF & Image Tools" />
    <meta
      name="twitter:description"
      content="Convert, compress, and edit PDF & image files instantly."
    />
    <meta name="twitter:image" content="/logo.svg" />

    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="nPc7VlFrVSodEL41GctguWqkdVq7f8mrr8GwwrPv_FA"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PDFTools",
        "url": "https://yourwebsite.com",
        "logo": "/logo.svg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
